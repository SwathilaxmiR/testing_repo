rules:
- id: fixora-wrapper-get-user-sql-injection
  patterns:
  - pattern-inside: "def get_user(...):\n  ..."
  - pattern-either:
    - pattern: sqlite3.connect(...)
    - pattern: $OBJ.connect(...)
    - pattern: connect(...)
    - pattern: conn.cursor(...)
    - pattern: $OBJ.cursor(...)
    - pattern: cursor(...)
    - pattern: cursor.execute(...)
    - pattern: $OBJ.execute(...)
    - pattern: execute(...)
  message: 'SQL Injection via `user_id`

    Vulnerable Sink: Passes untrusted data directly to `sqlite3.connect, conn.cursor,
    cursor.execute`.'
  severity: ERROR
  languages:
  - python
  metadata: &id001
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: SQL Injection
    confidence: HIGH
    wrapper_defined_in: backend/easy.py
    wraps:
    - sqlite3.connect
    - conn.cursor
    - cursor.execute
    modules_used:
    - sqlite3
    - flask
    vulnerable_parameter: user_id
    malicious_payload: 1 OR 1=1 --
    exploit_explanation: The attacker-controlled user_id is concatenated into the
      SQL WHERE clause, so the payload converts the predicate into an always-true
      condition.
    exploit_injected_example: get_user(user_id = 1 OR 1=1 --)
    impact_summary: Attackers can exfiltrate all rows from the table and bypass authorization
      checks tied to user scoping.
    cwe: &id007
    - CWE-89
    owasp: &id008
    - A03:2021
- id: fixora-taint-get-user-sql-injection
  mode: taint
  pattern-sources:
  - pattern: request.args.get('id')
  - pattern: request.$W(...)
  - pattern: request.$W
