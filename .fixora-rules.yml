    SQL Injection via `user_id`

    Vulnerable Sink: Passes untrusted data directly to `sqlite3.connect, conn.cursor,
    cursor.execute`.'
  severity: ERROR
  languages:
  - python
  metadata: *id001
  pattern-sanitizers:
  - pattern: int(...)
  - pattern: parameterized_query(...)
